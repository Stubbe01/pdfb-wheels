name: Download Python 3.10 Wheels
on: [workflow_dispatch]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Download wheels
        run: |
          mkdir -p wheels_py310
          pip download \
            "openai==3.35.1" \
            "pytesseract==0.3.13" \
            "pillow==12.3.0" \
            "pymupdf==1.28.2" \
            -d wheels_py310
      - name: List wheels
        run: ls -la wheels_py310/
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-python310
          path: wheels_py310/
